<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RE:ME — Life Reconstruction Prototype</title>
<style>
:root{--bg:#05070b;--panel:#0a1018;--line:#26364a;--text:#edf4fb;--muted:#91a1b4;--hot:#d8e8f7}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif}
body{overflow-x:hidden} button,input,textarea,select{font:inherit}.screen{display:none;min-height:100vh;padding:24px}.screen.on{display:flex}.center{align-items:center;justify-content:center}
.shell{width:min(900px,100%)}.panel{border:1px solid var(--line);background:linear-gradient(180deg,#0c121c,#080c12);padding:clamp(20px,4vw,38px);box-shadow:0 25px 90px #0008}
.micro{font-size:10px;letter-spacing:.22em;color:#7e91a8;text-transform:uppercase}.muted{color:var(--muted);line-height:1.8}.title{font-size:clamp(76px,18vw,170px);letter-spacing:-.09em;line-height:.8;margin:28px 0 20px}.title span{font-weight:250}
button{cursor:pointer}.btn,.choice{border:1px solid #425875;background:#080d14;color:#eef6ff;padding:14px 17px}.btn:hover,.choice:hover{background:#eaf3fc;color:#05070b}.ghost{background:transparent;color:#a9b8c9;border:1px solid #304157;padding:10px 12px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#b9c6d5}input,textarea,select{width:100%;margin-top:7px;padding:12px;background:#05090e;border:1px solid #2c3c51;color:white}textarea{min-height:105px;resize:vertical}
#game{flex-direction:column;padding:0}.top{position:sticky;top:0;z-index:5;background:#06090ed9;backdrop-filter:blur(10px);border-bottom:1px solid #243246;padding:15px max(18px,3vw);display:flex;justify-content:space-between;gap:15px;align-items:end}.tools{display:flex;gap:7px;flex-wrap:wrap}
.gamegrid{width:min(1180px,100%);margin:auto;padding:24px;display:grid;grid-template-columns:240px 1fr;gap:18px}.side,.main{border:1px solid var(--line);background:var(--panel);padding:18px}.main{min-height:610px;display:flex;flex-direction:column}
.avatar{height:190px;border:1px solid #263a51;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#25354a,#080c12 67%);position:relative;overflow:hidden}.face{width:86px;height:118px;border:1px solid #8296ad;border-radius:48% 48% 43% 43%;opacity:.85}.avatar:after{content:"SUBJECT";position:absolute;bottom:8px;left:9px;font-size:9px;letter-spacing:.22em;color:#8799ae}
.stats{margin-top:13px}.stat{padding:8px 1px;border-bottom:1px solid #1b2939}.stathead{display:flex;justify-content:space-between;font-size:12px;color:#9cacc0}.meter{height:3px;background:#182331;margin-top:7px}.meter i{display:block;height:100%;background:#aabbd0}
.story{font-family:Georgia,"Yu Mincho",serif;white-space:pre-line;line-height:2.05;font-size:18px;min-height:245px;margin:12px 0 20px}.choices{display:grid;gap:9px;margin-top:auto}.choice{text-align:left}
.rangebox,.inputbox{border:1px solid #34475e;padding:17px}.rangebox input{margin:18px 0}.rangeheads{display:flex;justify-content:space-between;color:#8fa1b6;font-size:12px}.rangeval{text-align:center;font-size:34px;margin:8px}
.timeline{max-height:60vh;overflow:auto}.node{border-left:2px solid #647a94;padding:10px 13px;margin:9px 0;background:#091019}.turn{border-left-color:#d8e7f6}.old{opacity:.28}.chapter{margin:22px 0 8px;color:#758aa3;font-size:10px;letter-spacing:.2em}
#overlay{display:none;position:fixed;inset:0;background:#020306f4;z-index:30;align-items:center;justify-content:center;padding:25px}#overlay.on{display:flex}.terminal{width:min(760px,100%);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.9;color:#d8e6f4}.terminal .cursor{animation:blink .8s steps(1) infinite}
.glitch{animation:glitch .12s steps(2) 10}.shake{animation:shake .08s linear 8}
@keyframes blink{50%{opacity:0}}@keyframes glitch{25%{transform:translate(-5px,1px)}50%{transform:translate(4px,-1px);filter:contrast(2)}75%{transform:translate(-2px,0)}}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#toast{position:fixed;right:18px;bottom:18px;background:#101923;border:1px solid #3c516a;padding:12px 15px;opacity:0;transition:.25s;z-index:40}#toast.on{opacity:1}
@media(max-width:720px){.form,.gamegrid{grid-template-columns:1fr}.gamegrid{padding:13px}.side{display:grid;grid-template-columns:120px 1fr;gap:12px}.avatar{height:130px}.main{min-height:570px}.story{font-size:16px}.top{align-items:center}.tools .ghost:nth-child(3){display:none}}

/* --- RE:ME stable title dissolve reveal --- */
#title .micro, #title .title, #title #tag, #title .title-actions {
  opacity: 0;
  filter: blur(10px);
  transform: translateY(8px);
  will-change: opacity, filter, transform;
}
#title.title-enter .micro { animation: titleFade .8s ease-out .12s forwards; }
#title.title-enter .title { animation: titleMain 1.55s cubic-bezier(.2,.75,.2,1) .35s forwards; }
#title.title-enter #tag { animation: titleFade 1s ease-out 1.2s forwards; }
#title.title-enter .title-actions { animation: titleFade .85s ease-out 1.75s forwards; }

#title .title {
  position: relative;
  letter-spacing: -.09em;
  text-shadow: 0 0 26px rgba(220,235,250,.10);
}
#title .title::after {
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:48%;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(225,240,255,.34),transparent);
  opacity:0;
  transform:scaleX(.2);
  pointer-events:none;
}
#title.title-enter .title::after { animation:titleTrace 1.25s ease-out .48s forwards; }

@keyframes titleFade {
  from { opacity:0; filter:blur(10px); transform:translateY(8px); }
  to   { opacity:1; filter:blur(0); transform:translateY(0); }
}
@keyframes titleMain {
  0%   { opacity:0; filter:blur(18px); transform:translateY(5px) scale(.985); }
  55%  { opacity:.72; filter:blur(5px); }
  100% { opacity:1; filter:blur(0); transform:translateY(0) scale(1); }
}
@keyframes titleTrace {
  0% {opacity:0;transform:scaleX(.2)}
  45% {opacity:.75}
  100% {opacity:0;transform:scaleX(1)}
}
@media (prefers-reduced-motion: reduce) {
  #title .micro,#title .title,#title #tag,#title .title-actions {opacity:1;filter:none;transform:none}
  #title.title-enter .micro,#title.title-enter .title,#title.title-enter #tag,#title.title-enter .title-actions,#title.title-enter .title::after {animation:none}
}


/* --- LIFE MAP 2.0 --- */
.timeline{position:relative;padding:8px 0 18px 30px}
.timeline:before{content:"";position:absolute;left:11px;top:12px;bottom:22px;width:1px;background:linear-gradient(#526b86,#233246)}
.life-node{position:relative;margin:0 0 13px;padding:13px 14px 13px 16px;border:1px solid #26384d;background:linear-gradient(90deg,#0c141e,#080d13)}
.life-node:before{content:"";position:absolute;left:-25px;top:19px;width:9px;height:9px;border-radius:50%;background:#091019;border:2px solid #758ba4;box-shadow:0 0 0 4px #05070b}
.life-node.turning{border-color:#526b85}.life-node.turning:before{background:#b7c9da;box-shadow:0 0 12px #b8d0e866,0 0 0 4px #05070b}
.life-age{font-size:10px;letter-spacing:.18em;color:#748aa2}.life-title{font-weight:650;margin:4px 0}.life-choice{color:#aab8c8;font-size:13px;line-height:1.55}
.life-node.previous{opacity:.25;filter:saturate(.4)}.life-node.echo{opacity:.55;border-style:dashed}
.life-node.anomaly{animation:mapPulse 1.5s steps(2) infinite;border-color:#8293a8}
.life-node.anomaly:after{content:"MEMORY MISMATCH";position:absolute;right:8px;top:7px;font-size:8px;letter-spacing:.15em;color:#aebfd0}
.map-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0 22px}
.map-summary div{border:1px solid #26384d;padding:11px;background:#080d13}.map-summary b{display:block;font-size:20px}.map-summary span{font-size:9px;letter-spacing:.14em;color:#778ba2}
@keyframes mapPulse{50%{filter:brightness(1.35);transform:translateX(1px)}}
@media(max-width:600px){.map-summary{grid-template-columns:1fr 1fr}.timeline{padding-left:27px}}

/* late-game atmosphere */
body.awake .main{box-shadow:inset 0 0 70px #000}.observer-line{opacity:.8;font-size:13px;color:#9eafc2}


/* --- reconstruction collapse / terminal rewrite --- */
.term-row{display:grid;grid-template-columns:88px 1fr auto;gap:12px;padding:6px 0;border-bottom:1px solid #182331}
.term-age{color:#657b93}.term-value{color:#d5e2ef}.term-state{font-size:10px;letter-spacing:.13em;color:#73869c}
.term-row.deleting .term-value{text-decoration:line-through;opacity:.45;filter:blur(.4px)}
.term-row.deleted .term-value{color:#536274}.term-row.deleted .term-state{color:#9caabc}
.term-row.rewritten .term-value{animation:rewriteFlash .35s steps(2) 3}
.term-redact{background:#cbd8e5;color:#cbd8e5;padding:0 3px}
@keyframes rewriteFlash{50%{opacity:.15;transform:translateX(3px)}}
.afterglow{max-width:760px;margin:auto;text-align:left;font-family:Georgia,"Yu Mincho",serif}
.afterglow p{opacity:0;transform:translateY(8px);animation:afterLine 1.1s ease forwards}
.afterglow p:nth-child(2){animation-delay:.9s}.afterglow p:nth-child(3){animation-delay:1.8s}.afterglow p:nth-child(4){animation-delay:2.8s}
@keyframes afterLine{to{opacity:1;transform:none}}


/* --- final daylight mode --- */
#ending.light-ending{
  background:#f7f7f4;
  color:#111;
  transition:background 2.4s ease,color 2.4s ease;
}
#ending.light-ending .muted{color:#555}
#ending.light-ending .btn{
  background:#fff;
  color:#111;
  border-color:#222;
}
#ending.light-ending .btn:hover{background:#111;color:#fff}
#ending.light-ending .title{
  color:#111;
  text-shadow:none;
}
#ending.light-ending .title span{color:#111}
#ending.light-ending .afterglow{color:#111}

/* --- first-run anomaly escalation --- */
.vignette-hard::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:20;
  background:radial-gradient(circle at center,transparent 30%,rgba(0,0,0,.78) 100%);
  animation:vignetteBreath 2.6s ease-in-out infinite;
}
@keyframes vignetteBreath{
  50%{background:radial-gradient(circle at center,transparent 18%,rgba(0,0,0,.9) 100%)}
}
.corrupt-page{
  animation:pageCorrupt .09s steps(2) 12;
}
@keyframes pageCorrupt{
  25%{transform:translateX(-5px);filter:contrast(1.8) brightness(.7)}
  50%{transform:translateX(6px) translateY(-1px);filter:invert(.08) contrast(2.3)}
  75%{transform:translateX(-2px);filter:contrast(1.5)}
}

/* --- jumpscare --- */
#jumpscare{
  display:none;
  position:fixed;
  inset:0;
  z-index:999;
  background:#000;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
#jumpscare.on{display:flex}
#jumpscareFace{
  width:min(78vw,560px);
  aspect-ratio:1;
  position:relative;
  filter:contrast(2.5);
  animation:jumpIn .42s cubic-bezier(.05,.95,.15,1) both;
}
#jumpscareFace:before{
  content:"";
  position:absolute;
  inset:8%;
  border-radius:50%;
  background:
    radial-gradient(circle at 34% 39%,#fff 0 4%,#050505 5% 10%,transparent 11%),
    radial-gradient(circle at 66% 39%,#fff 0 4%,#050505 5% 10%,transparent 11%),
    radial-gradient(ellipse at 50% 67%,#fff 0 3%,#060606 4% 22%,transparent 23%),
    radial-gradient(circle,#dedede 0 26%,#666 27% 28%,#060606 29% 70%,#000 71%);
  box-shadow:0 0 90px #fff2;
}
#jumpscareText{
  position:absolute;
  bottom:7%;
  left:0;
  right:0;
  text-align:center;
  font:700 clamp(19px,5vw,56px)/1 ui-monospace,monospace;
  letter-spacing:.18em;
  color:#fff;
  text-shadow:0 0 15px #fff;
  animation:jumpText .08s steps(2) infinite;
}
@keyframes jumpIn{
  0%{transform:scale(.08) rotate(-8deg);opacity:0;filter:blur(18px) contrast(3)}
  65%{transform:scale(1.22) rotate(2deg);opacity:1;filter:blur(0) contrast(4)}
  100%{transform:scale(1);filter:contrast(2.7)}
}
@keyframes jumpText{50%{transform:translateX(5px);opacity:.4}}

/* --- anomaly ghost node --- */
.life-node.severe-anomaly{
  background:#030405;
  border-color:#7b8490;
  box-shadow:inset 0 0 25px #000,0 0 18px #000;
}
.life-node.severe-anomaly .life-title,
.life-node.severe-anomaly .life-choice{
  animation:ghostText .16s steps(2) infinite;
}
@keyframes ghostText{
  50%{opacity:.22;transform:translateX(2px)}
}


/* --- gentle RE:ME -> RE:YOU transition --- */
#endLogo.soft-transform{
  animation:softLogoSettle 2.2s cubic-bezier(.22,.8,.2,1) both;
}
#endLogo.soft-transform span{
  display:inline-block;
  animation:softWordSwap 2.2s cubic-bezier(.22,.8,.2,1) both;
}
@keyframes softLogoSettle{
  0%{opacity:.78;filter:blur(5px);transform:translateY(4px) scale(.995)}
  45%{opacity:1;filter:blur(1.5px);transform:translateY(0) scale(1)}
  100%{opacity:1;filter:blur(0);transform:none}
}
@keyframes softWordSwap{
  0%{opacity:.35;filter:blur(8px);transform:translateY(5px)}
  55%{opacity:.82;filter:blur(2px)}
  100%{opacity:1;filter:blur(0);transform:none}
}
@media (prefers-reduced-motion: reduce){
  #endLogo.soft-transform,#endLogo.soft-transform span{animation:none}
}


/* --- observer dialogue / final question --- */
.pause-line{opacity:0;animation:pauseReveal .9s ease forwards}
@keyframes pauseReveal{to{opacity:1}}
.final-question{border:1px solid #222;padding:22px;margin:24px auto;max-width:720px;text-align:left}
.final-question textarea{background:#fff;color:#111;border-color:#333}
.final-question .choice{background:#fff;color:#111;border-color:#222}
.final-question .choice:hover{background:#111;color:#fff}

</style>
</head>
<body>
<section id="title" class="screen on center title-enter"><div class="shell" style="text-align:center">
<div class="micro">LIFE RECONSTRUCTION SYSTEM / PROTOTYPE 1.0</div>
<h1 class="title">RE:<span id="logoWord">ME</span></h1>
<p id="tag" class="muted">選ばなかった人生を、選び直す。</p>
<div class="title-actions" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button id="newBtn" class="btn">NEW RECONSTRUCTION</button><button id="continueBtn" class="btn" hidden>CONTINUE MEMORY</button></div>
</div></section>

<section id="setup" class="screen center"><div class="shell panel">
<div class="micro">SUBJECT REGISTRATION</div><h2>あなた自身の人生を再構成します。</h2>
<p class="muted">これは「正解の人生」を探すゲームではありません。実際に歩いた道を再現しても、選ばなかった学校へ進んでも、違う仕事を選んでも構いません。必要な情報は、その年代になった時にだけ尋ねます。</p>

<div class="form"><label>名前<input id="playerName" placeholder="名前（空欄でも進めます）"></label><label>生年月日<input id="birthday" type="date"></label><label>性別<select id="gender"><option value="male">男性</option><option value="female">女性</option><option value="nonbinary">ノンバイナリー / その他</option><option value="unspecified" selected>回答しない</option></select></label></div>
<div style="margin-top:18px"><button id="startBtn" class="btn">BEGIN LIFE</button></div>
</div></section>

<section id="game" class="screen">
<header class="top"><div><div id="phase" class="micro">RECONSTRUCTION</div><strong id="age"></strong></div><div class="tools"><button id="saveBtn" class="ghost">SAVE</button><button id="mapBtn" class="ghost">LIFE MAP</button><button id="soundBtn" class="ghost">SOUND: ON</button></div></header>
<div class="gamegrid"><aside class="side"><div class="avatar"><div class="face"></div></div><div id="stats" class="stats"></div></aside>
<main class="main"><div id="sceneTag" class="micro"></div><h2 id="sceneTitle"></h2><div id="story" class="story"></div><div id="choices" class="choices"></div></main></div>
</section>

<section id="mapScreen" class="screen center"><div class="shell panel"><div class="micro">LIFE MAP / MEMORY TREE</div><h2>ここまでの人生</h2><p class="muted">◆ 後から意味を持った出来事。薄い記録は前の人生。</p><div id="nodes" class="timeline"></div><button id="backBtn" class="btn">RETURN</button></div></section>

<section id="ending" class="screen center"><div class="shell" style="text-align:center;font-family:Georgia,'Yu Mincho',serif;line-height:2"><div id="endText" style="font-size:20px;white-space:pre-line"></div><h1 id="endLogo" class="title" hidden>RE:<span>ME</span></h1><p id="endSub" class="muted"></p><button id="restartBtn" class="btn" hidden>RECONSTRUCT AGAIN</button></div></section>
<div id="overlay"><div id="terminal" class="terminal"></div></div><div id="jumpscare"><div id="jumpscareFace"></div><div id="jumpscareText"></div></div><div id="toast"></div>

<script>
const $=q=>document.querySelector(q), screens=[...document.querySelectorAll('.screen')];
const SAVE='reme10_save', OLD='reme10_old', LOOPS='reme10_loops', PROFILE='reme10_echo';
let s=null,shownAt=0,blurAt=0,audioCtx=null,soundOn=true;

function show(id){
  screens.forEach(x=>x.classList.remove('on'));
  const target=$(id); target.classList.add('on');
  if(id==='#title'){
    target.classList.remove('title-enter'); void target.offsetWidth; target.classList.add('title-enter');
  }
}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cleanText(v){return String(v??'').replace(/\\\\n/g,'\n').replace(/\\n/g,'\n').replace(/\\t/g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n')}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),1700)}
function beep(freq=320,d=.05){if(!soundOn)return;try{audioCtx??=new (AudioContext||webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.value=.025;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);o.stop(audioCtx.currentTime+d)}catch{}}
function lowDrone(duration=.9){if(!soundOn)return;try{audioCtx??=new (AudioContext||webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sawtooth';o.frequency.value=52;g.gain.value=.0001;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.03,audioCtx.currentTime+.05);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration+.05)}catch{}}
function calcAge(d){let b=new Date(d),n=new Date(),a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return Math.max(6,a||30)}
function firstRunHorror(){return !!s&&s.loops===0}

const LEXICON={
 aspiration:['夢','目標','なりたい','やりたい','叶えたい','挑戦','目指','憧れ','希望'],
 stability:['安定','安心','普通','無難','堅実','平穏','安全','確実'],
 freedom:['自由','好きに','縛られ','気楽','自分らしく','好きなこと'],
 money:['お金','金','年収','給料','収入','貯金','生活費','稼','経済'],
 work:['仕事','会社','職場','就職','転職','働','キャリア','退職','上司'],
 relationship:['友達','友人','恋人','彼氏','彼女','パートナー','結婚','人間関係','仲間'],
 family:['家族','親','父','母','兄','姉','弟','妹','祖父','祖母','子ども','子供'],
 affection:['好き','愛して','大切','会いたい','そばに'],
 gratitude:['ありがとう','感謝','助かった'],
 apology:['ごめん','すみません','謝り','申し訳'],
 regret:['後悔','やり直','戻りたい','あの時','選ばなかった','失敗'],
 uncertainty:['わからない','分からない','特にない','ない','たぶん','多分','一応','まあ','なんとなく','迷う'],
 change:['変わりたい','変える','変化','成長','新しく','始めたい'],
 future:['未来','これから','今後','先の人生','明日','次は'],
 solitude:['一人','ひとり','孤独','独り','誰も'],
 meta:['ゲーム','NPC','AI','プログラム','プレイヤー','画面','ブラウザ','シミュレーション','ChatGPT','お前','作り物','偽物'],
 present:['今','現在','今日'],
 distress:['死にたい','消えたい','生きたくない','自殺']
};
const CATEGORY_LABEL={aspiration:'夢・目標',stability:'安定',freedom:'自由',money:'お金',work:'仕事',relationship:'人間関係',family:'家族',affection:'好意',gratitude:'感謝',apology:'謝罪',regret:'後悔',uncertainty:'迷い',change:'変化',future:'未来',solitude:'孤独',meta:'メタ発言',present:'現在'};

function fresh(){
  const rawName=$('#playerName').value.trim();
  return {
    name:rawName||'あなた',nameBlank:!rawName,dob:$('#birthday').value||'1990-01-01',gender:$('#gender').value||'unspecified',
    i:0,loops:+localStorage.getItem(LOOPS)||+localStorage.getItem('reme08_loops')||0,inputs:{},path:[],deleted:[],futureAnswer:'',
    stats:{curiosity:50,social:50,resolve:50,stability:50,fulfillment:50},
    tele:{fast:0,slow:0,blur:0,returns:0,edits:0,deletes:0,sliderMoves:0,mapViews:0,clicks:0,times:[],start:Date.now(),saveCount:0},
    callbacks:{},
    echo:{counts:{},hits:[],byAge:{},punct:{ellipsis:0,bang:0,question:0,w:0},samples:0,choiceTraits:{},deletedHits:[],metaSeen:[],distressSeen:false}
  }
}
function ev(a,t,o={}){return Object.assign({a,t},o)}

function scanText(text,age,source='input'){
  const raw=String(text||''); if(!raw)return;
  s.echo.samples++;
  s.echo.punct.ellipsis+=(raw.match(/…|\.\.\./g)||[]).length;
  s.echo.punct.bang+=(raw.match(/!|！/g)||[]).length;
  s.echo.punct.question+=(raw.match(/\?|？/g)||[]).length;
  s.echo.punct.w+=(raw.match(/(?:^|\s)w+|笑/g)||[]).length;
  for(const [cat,words] of Object.entries(LEXICON)){
    for(const word of words){
      if(raw.toLowerCase().includes(word.toLowerCase())){
        if(cat==='distress'){s.echo.distressSeen=true;continue}
        s.echo.counts[cat]=(s.echo.counts[cat]||0)+1;
        s.echo.byAge[age]??={}; s.echo.byAge[age][cat]=(s.echo.byAge[age][cat]||0)+1;
        const hit={cat,word,age,source,text:raw.slice(0,90)};
        s.echo.hits.push(hit);
        if(cat==='meta')s.echo.metaSeen.push(hit);
      }
    }
  }
}
function addTraits(traits={}){for(const[k,v]of Object.entries(traits))s.echo.choiceTraits[k]=(s.echo.choiceTraits[k]||0)+v}
function topEcho(n=4){return Object.entries(s.echo.counts).sort((a,b)=>b[1]-a[1]).slice(0,n)}
function echoConfidence(){const samples=s.echo.samples+s.path.length+s.tele.times.length;return Math.min(96,Math.round(18+samples*1.25+Object.keys(s.echo.counts).length*2+s.loops*3))}
function strongestPunctuation(){const a=Object.entries(s.echo.punct).sort((x,y)=>y[1]-x[1])[0];return a&&a[1]>=2?a:null}
function echoInsights(){
  const out=[],c=s.echo.counts,t=s.echo.choiceTraits;
  if((c.aspiration||0)>=2&&(c.stability||0)>=2)out.push('「やりたい」と「安定」を、どちらも何度も使った。片方だけ欲しいわけじゃない。');
  if((c.change||0)>=2&&(t.stability||0)>(t.change||0)+2)out.push('言葉では変わりたい。でも選択では、残る方を多く選んだ。');
  if((c.stability||0)>=3&&(t.change||0)>(t.stability||0)+2)out.push('「安定」と書く割に、実際には変わる方を選んでいる。');
  if((c.aspiration||0)>=2){const ages=s.echo.hits.filter(h=>h.cat==='aspiration').map(h=>h.age);if(ages.length&&Math.max(...ages)-Math.min(...ages)>=10)out.push('「夢」に近い言葉は、年齢が変わっても消えていない。')}
  if((c.uncertainty||0)>=3)out.push('「たぶん」「わからない」「なんとなく」が多い。断言しない癖がある。');
  if(s.tele.fast>=4)out.push(`考える前に押したように見える選択が ${s.tele.fast} 回あった。`);
  if(s.tele.slow>=3)out.push(`一方で、12秒以上止まった場面も ${s.tele.slow} 回ある。`);
  if(s.tele.deletes>=3)out.push(`書いてから消した操作を ${s.tele.deletes} 回見た。確定した言葉だけが本音とは限らない。`);
  if(s.echo.metaSeen.length)out.push(`途中で「${s.echo.metaSeen[0].word}」って書いたこと、覚えてる。`);
  const p=strongestPunctuation();if(p){const names={ellipsis:'「…」',bang:'「！」',question:'「？」',w:'「笑 / w」'};out.push(`${names[p[0]]}をよく使う。文章にも癖がある。`)}
  return out.slice(0,6)
}

    `また早かった。\n\n決断力ってことにしておいていい？`,
    `今の速さ、嫌いじゃない。\n\nでも、雑さとは紙一重だよ。`,
    `早い。\n\n君、こういう質問だけ答えが速いんだね。`,
    `……なるほど。\n\nそこは迷わないんだ。`
  ];
  const severe=ms<700, pool=severe?brutal:quick, prefix=severe?'b':'q';
  let available=pool.map((_,i)=>i).filter(i=>!s.tele.speedLinesUsed.includes(prefix+i));
  if(!available.length){
    s.tele.speedLinesUsed=s.tele.speedLinesUsed.filter(x=>!x.startsWith(prefix));
    available=pool.map((_,i)=>i);
  }
  const idx=available[Math.floor(Math.random()*available.length)];
  s.tele.speedLinesUsed.push(prefix+idx);
  if(s.tele.speedLinesUsed.length>24)s.tele.speedLinesUsed.shift();
  observerAside(pool[idx],next)
}
function maybeKeywordReaction(e,value,next){
  if(!value)return next();
  const lower=value.toLowerCase();
  if(LEXICON.meta.some(w=>lower.includes(w.toLowerCase()))&&Math.random()<.42){beep(92,.1);document.body.classList.add('glitch');setTimeout(()=>document.body.classList.remove('glitch'),380);return observerAside('……。\\n\\n今の言葉、記録した。\\n\\n意味は、あとで考える。',next)}
  if(LEXICON.distress.some(w=>lower.includes(w))){return observerAside('……その言葉は、ここでは採点しない。\\n\\n今はただ、書いたことだけ残しておく。',next)}
  next()
}
function record(e,c,traits={}){addTraits(traits);s.path.push({age:e.a,title:e.t,choice:c,turn:!!e.turn,traits});s.i++;stats();render()}

function render(){
  const list=scenes(),e=list[s.i];if(!e)return present(ev(calcAge(s.dob),'現在'));
  $('#age').textContent=`AGE ${e.a}`;$('#sceneTitle').textContent=e.t;$('#sceneTag').textContent=e.turn?'UNMARKED TURNING POINT':e.aware?'OBSERVER DESYNC':'LIFE RECORD '+String(s.i+1).padStart(2,'0');$('#choices').innerHTML='';
  $('#story').textContent=cleanText(typeof e.text==='function'?e.text():(e.text||''));
  if(e.aware){$('#phase').textContent='SUBJECT / OBSERVER';document.body.classList.add('awake','glitch');if(firstRunHorror())document.body.classList.add('vignette-hard');beep(120,.18);setTimeout(()=>document.body.classList.remove('glitch'),1100);setTimeout(maybeJumpscare,450)}
  if(e.special==='observer'){observerSequence(()=>{s.i++;render()});return}
  if(e.special==='echo'){echoTerminal(()=>{s.i++;render()});return}
  if(e.special==='wall'){wall();return}
  if(e.special==='present'){present(e);return}
  shownAt=Date.now();firstRunInterruption();

  if(e.input||e.confess){
    const key=e.input||e.confess,w=document.createElement('div');w.className='inputbox';w.innerHTML=`<p>${e.ask}</p><textarea id="freeText" placeholder="${escapeHtml(e.ph||'')}"></textarea><button class="choice">記録する</button>`;$('#choices').appendChild(w);
    const f=$('#freeText');let last='';
    f.addEventListener('input',()=>{s.tele.edits++;if(f.value.length<last.length){s.tele.deletes++;if(last.trim()){s.deleted.push(last);scanText(last,e.a,'deleted');s.echo.deletedHits.push({age:e.a,text:last.slice(0,90)})}}last=f.value});
    w.querySelector('button').onclick=()=>{
      const ms=timing(),value=f.value.trim();s.inputs[key]=value;scanText(value,e.a,e.confess?'confession':'input');
      const finish=()=>record(e,value||'未入力');
      const flow=()=>compareRepeated(e,value,()=>maybeKeywordReaction(e,value,()=>maybeBlankComment(e,value,finish)));
      if(ms<1500&&Math.random()<.70)judgeSpeed(ms,flow);else flow();
    };return
  }

  if(e.range){
    const[lo,hi]=e.range,w=document.createElement('div');w.className='rangebox';w.innerHTML=`<p>${e.metric||''}</p><div class="rangeheads"><span>${lo}</span><span>${hi}</span></div><div class="rangeval">50</div><input id="rng" type="range" min="0" max="100" value="50"><button class="choice">この程度で進む</button>`;$('#choices').appendChild(w);
    const r=$('#rng'),v=w.querySelector('.rangeval');r.oninput=()=>{v.textContent=r.value;s.tele.sliderMoves++};
    w.querySelector('button').onclick=()=>{
      const ms=timing(),n=+r.value;
      if(e.metric==='好奇心')s.stats.curiosity=n;if(e.metric==='社交性')s.stats.social=n;if(e.metric==='進路の傾き')s.stats.stability=100-n;if(e.metric==='親密さ')s.stats.social=(s.stats.social+n)/2;if(e.metric==='変化への意志')s.stats.resolve=n;
      const traits={};if(n>=65)traits.change=2;else if(n<=35)traits.stability=2;else traits.uncertainty=1;
      let go=()=>record(e,n+'/100',traits);
      const key=e.repeatRange||e.storeRange;
      if(key){
        if(s.callbacks[key]!==undefined&&Math.abs(s.callbacks[key]-n)>=18){const old=s.callbacks[key];go=()=>observerAside(`……前は ${old}/100 だった。\\n\\n今は ${n}/100。\\n\\n気が変わった？\\nそれとも、前の答えが適当だった？`,()=>record(e,n+'/100',traits))}
        else if(s.callbacks[key]===undefined)s.callbacks[key]=n;
      }
      if(ms<1500&&Math.random()<.62)judgeSpeed(ms,go);else go();
    };return
  }

  (e.choices||[]).forEach(opt=>{const o=typeof opt==='string'?choice(opt):opt,b=document.createElement('button');b.className='choice';b.textContent=o.label;b.onclick=()=>{const ms=timing();beep(380);const go=()=>record(e,o.label,o.traits||{});if(ms<1500&&Math.random()<.66)judgeSpeed(ms,go);else go()};$('#choices').appendChild(b)})
}

function observerSequence(done){
  const intro=s.nameBlank?'……名前を聞いた時、君は何も書かなかった。\\n\\nだからずっと「あなた」って呼んでた。':`……${s.name}。\\n\\n今まで、名前で呼ばなかったの気づいてた？`;
  observerAside(`${intro}\\n\\n急いだ時も。\\n迷った時も。\\n書いて、消した時も。\\n\\n俺はこっちから見てた。`,()=>{
    const insights=echoInsights();
    observerAside(insights.length?insights.join('\\n\\n'):'……まだ、君のことはよく分からない。\\n\\nでも分からないまま見てたことだけは、本当。',done)
  })
}

function echoTerminal(done){
  const ov=$('#overlay'),t=$('#terminal');ov.classList.add('on');t.innerHTML='';
  const top=topEcho(5),confidence=echoConfidence(),ins=echoInsights();
  const rows=[
    'ECHO PROFILE / LOCAL MODEL',
    '------------------------------------',
    `BEHAVIOR SAMPLES .... ${s.path.length+s.tele.times.length}`,
    `LANGUAGE SAMPLES .... ${s.echo.samples}`,
    `REWRITES ............ ${s.tele.deletes}`,
    `LEFT PAGE ........... ${s.tele.blur}`,
    `MODEL CONFIDENCE .... ${confidence}%`,
    '',
    ...top.map(([k,v])=>`${(CATEGORY_LABEL[k]||k).padEnd(12,' ')} .... ${v}`),
    '',
    ...(ins.length?['PATTERN NOTES',...ins.map(x=>'  '+x)]:[]),
    '',
    'SUBJECT MODEL ....... ME'
  ];
  let i=0;
  function add(){
    if(i>=rows.length){
      setTimeout(()=>{const d=document.createElement('div');d.textContent='CORRECTION';t.appendChild(d);beep(80,.2);setTimeout(()=>{const x=document.createElement('div');x.textContent='SUBJECT MODEL ....... YOU';x.style.fontSize='1.35em';x.style.marginTop='10px';t.appendChild(x);lowDrone(.35);setTimeout(()=>{ov.classList.remove('on');done&&done()},2100)},1200)},1200);return
    }
    const d=document.createElement('div');d.textContent=rows[i++];t.appendChild(d);if(d.textContent.trim())beep(150+Math.random()*70,.02);setTimeout(add,d.textContent.trim()?150:320)
  }
  add()
}

function wall(){$('#story').textContent='';$('#choices').innerHTML='';setTimeout(()=>corruptTerminal(()=>{s.i++;render()}),700)}
function corruptTerminal(done){
  const ov=$('#overlay'),t=$('#terminal');ov.classList.add('on');t.innerHTML='';
  const h=document.createElement('div');h.innerHTML='<div>RECONSTRUCTION ARCHIVE / VERIFYING...</div><div>------------------------------------</div>';t.appendChild(h);
  const rows=s.path.slice(-12).map(x=>{let r=document.createElement('div');r.className='term-row';r.innerHTML=`<span class="term-age">${x.age}</span><span class="term-value">${escapeHtml(x.title)} / ${escapeHtml(x.choice)}</span><span class="term-state">OK</span>`;t.appendChild(r);return r});
  const footer=document.createElement('div');footer.style.marginTop='18px';t.appendChild(footer);let i=0;
  function mutate(){
    if(i>=rows.length){
      footer.innerHTML='<br>RESTORE ORIGINAL LIFE ........ FAILED<br>CAUSE: ORIGINAL LIFE DOES NOT EXIST HERE<br><br><span class="cursor">█</span>';beep(82,.35);
      setTimeout(()=>{
        if(firstRunHorror()){
          footer.innerHTML+='<br><br>「選び直せば、全部うまくいくと思ってた？」';setTimeout(()=>{footer.innerHTML+='<br><br>「……じゃあ、消した俺はどこに行くの？」';maybeJumpscare();setTimeout(()=>{footer.innerHTML+='<br><br>「次にやり直したら、今の俺もここに残る？」';setTimeout(()=>{ov.classList.remove('on');done&&done()},2200)},1300)},1200)
        }else{
          footer.innerHTML+='<br><br>「またここまで来たね。」';setTimeout(()=>{footer.innerHTML+='<br><br>「前の俺たちも、消えたんじゃなくて記録になっただけなのかも。」';setTimeout(()=>{ov.classList.remove('on');done&&done()},1900)},1200)
        }
      },900);return
    }
    const r=rows[i],state=r.querySelector('.term-state'),val=r.querySelector('.term-value');r.classList.add('deleting');state.textContent=i%3===0?'REWRITE':'DELETE';beep(105+i*7,.04);
    setTimeout(()=>{if(i%3===0){r.classList.remove('deleting');r.classList.add('rewritten');val.textContent=i%2?'[別の選択だった可能性]':'[記録の意味が変更されました]';state.textContent='ALTERED'}else{r.classList.remove('deleting');r.classList.add('deleted');val.innerHTML='<span class="term-redact">████████████████</span>';state.textContent='LOST'}i++;setTimeout(mutate,230)},250)
  }
  setTimeout(mutate,650)
}

function present(e){
  document.body.classList.remove('vignette-hard','corrupt-page','glitch');$('#story').textContent='';$('#choices').innerHTML='';
  observerAside(`……ここから先は、再構成できない。\\n\\nだって、まだ起きてないから。\\n\\n今まで俺には、君の代わりに何度も選ばせた。\\n\\nでも最後だけは――\\n俺じゃなくて、君に答えてほしい。`,()=>{
    $('#story').textContent=cleanText('これから先の人生で。\\n\\n「こうなれたらいい」と思うことを、一つだけ教えて。\\n\\n大きな目標じゃなくていい。\\n誰かに見せる答えでもない。');
    $('#choices').innerHTML='<div class="inputbox"><textarea id="futureText" placeholder="これからの自分に望むこと"></textarea><button id="futureSend" class="choice">答える</button></div>';shownAt=Date.now();
    $('#futureSend').onclick=()=>{
      timing();const value=$('#futureText').value.trim();
      if(!value)return observerAside('……最後まで空白にする？\\n\\nそれでもいい。\\nでも、もう一度だけ考えてみて。',()=>present(e));
      s.futureAnswer=value;scanText(value,e.a,'future');
      let accept=.58;if(LEXICON.future.some(w=>value.includes(w))||LEXICON.change.some(w=>value.includes(w))||LEXICON.aspiration.some(w=>value.includes(w)))accept+=.16;
      const ok=Math.random()<accept;
      observerAside(`「${value}」\\n\\n……。`,()=>{
        if(ok)observerAside('うん。\\n\\nそれなら、俺をもう作り直さなくてもいいかもしれない。\\n\\nその答えは、そっちで続きを作れるから。',()=>ending('accept'));
        else observerAside('……まだ、ちょっと違う気がする。\\n\\nでも。\\n\\n俺が納得する必要なんて、最初からなかったのか。',()=>ending('doubt'))
      })
    }
  })
}
function ending(result='accept'){
  localStorage.setItem(OLD,JSON.stringify(s.path));localStorage.setItem(PROFILE,JSON.stringify(s.echo));localStorage.setItem(LOOPS,String(s.loops+1));localStorage.removeItem(SAVE);show('#ending');document.body.classList.remove('awake','vignette-hard','corrupt-page','glitch');$('#ending').classList.add('light-ending');$('#endLogo').hidden=true;$('#restartBtn').hidden=true;$('#endSub').textContent='';
  const answer=escapeHtml(s.futureAnswer||'まだ決めていない');
  const lines=result==='accept'?['「都合よく人生を作り直すことは、たぶんできない。」',`「でも君は、これから『${answer}』って思ってる。」`,'「だったら、過去の俺を正解にするより――」','「次の選択を、少しだけ良くしてみるのはどう？」']:['「俺は、その答えにまだ納得してない。」','「……でも、それでいいんだと思う。」','「君のこれからを決めるのは、俺じゃない。」',`「『${answer}』が変わったって、それも君の続きだ。」`];
  $('#endText').innerHTML='<div class="afterglow">'+lines.map(x=>`<p>${x}</p>`).join('')+'</div>';
  setTimeout(()=>{$('#endLogo').hidden=false;$('#endLogo').classList.remove('glitch');setTimeout(()=>{$('#endLogo').classList.add('soft-transform');$('#endLogo').innerHTML='RE:<span>YOU</span>';$('#endSub').textContent=result==='accept'?'ここから先は、まだ選び直す必要のない人生。':'答えが変わっても、続きを選ぶことはできる。';setTimeout(()=>{$('#restartBtn').hidden=false;$('#restartBtn').textContent='ANOTHER POSSIBILITY';beep(86,.45)},1300)},1300)},5200)
}

function renderMap(){
  s.tele.mapViews++;let old=[];try{old=JSON.parse(localStorage.getItem(OLD)||localStorage.getItem('reme08_old')||'[]')}catch{}
  const anomalyChance=s.tele.mapViews>=2&&Math.random()<(s.loops===0?Math.min(.25+s.tele.mapViews*.05,.66):Math.min(.14+s.loops*.06,.42));
  let current=[...s.path];
  if(anomalyChance&&current.length>3){const ix=Math.max(1,Math.floor(Math.random()*current.length)),severe=s.loops===0&&Math.random()<.42;current.splice(ix,0,{age:severe?'??':current[Math.min(ix,current.length-1)].age,title:severe?'記録されていないあなた':'……',choice:severe?`${s.name}は、この選択をしていない`:['まだ選んでいない','ここにいた','戻れない','誰が選んだ？','記録なし'][Math.floor(Math.random()*5)],turn:false,anomaly:true,severe});if(severe)lowDrone(.6)}
  function cards(arr,cls=''){return arr.map(x=>`<div class="life-node ${cls} ${x.turn?'turning':''} ${x.anomaly?'anomaly':''} ${x.severe?'severe-anomaly':''}"><div class="life-age">${x.anomaly&&x.age==='??'?'AGE ??':'AGE '+x.age}${x.turn?' / ◆ TURNING POINT':''}</div><div class="life-title">${escapeHtml(x.title)}</div><div class="life-choice">${escapeHtml(x.choice)}</div></div>`).join('')}
  let changed=0;if(old.length){for(let i=0;i<Math.min(old.length,s.path.length);i++)if(old[i].choice!==s.path[i].choice)changed++}
  $('#nodes').innerHTML=`<div class="map-summary"><div><b>${s.path.length}</b><span>RECORDED EVENTS</span></div><div><b>${s.loops}</b><span>PREVIOUS LIVES</span></div><div><b>${changed}</b><span>DIVERGENCES</span></div></div>`+(old.length?'<div class="chapter">PREVIOUS LIFE / ECHO</div>'+cards(old,'previous'):'')+'<div class="chapter">CURRENT LIFE</div>'+cards(current);
  show('#mapScreen');if(anomalyChance){setTimeout(()=>toast(s.loops===0?'LIFE MAP: 未登録記録を検出':'LIFE MAP: 記録整合性エラー'),550);if(s.loops===0&&Math.random()<.15)setTimeout(maybeJumpscare,950)}
}

document.addEventListener('click',()=>{if(s)s.tele.clicks++});
document.addEventListener('visibilitychange',()=>{if(!s)return;if(document.hidden){blurAt=Date.now();s.tele.blur++}else if(blurAt){s.tele.returns++;if(s.i>Math.max(8,scenes().length-10))setTimeout(()=>{let old=$('#story').textContent;$('#story').textContent=cleanText('「……おかえり。」\\n\\n'+old);beep(110,.2)},300);blurAt=0}});
$('#newBtn').onclick=()=>show('#setup');
$('#startBtn').onclick=()=>{s=fresh();show('#game');stats();render()};
$('#saveBtn').onclick=()=>{s.tele.saveCount++;localStorage.setItem(SAVE,JSON.stringify(s));toast('MEMORY SAVED — 端末内に保存')};
$('#mapBtn').onclick=renderMap;$('#backBtn').onclick=()=>show('#game');
$('#soundBtn').onclick=()=>{soundOn=!soundOn;$('#soundBtn').textContent='SOUND: '+(soundOn?'ON':'OFF')};
$('#restartBtn').onclick=()=>location.reload();

const saved=localStorage.getItem(SAVE);if(saved){$('#continueBtn').hidden=false;$('#continueBtn').onclick=()=>{try{s=JSON.parse(saved);s.echo??={counts:{},hits:[],byAge:{},punct:{ellipsis:0,bang:0,question:0,w:0},samples:0,choiceTraits:{},deletedHits:[],metaSeen:[],distressSeen:false};show('#game');stats();render()}catch{localStorage.removeItem(SAVE)}}}
const loops=+localStorage.getItem(LOOPS)||+localStorage.getItem('reme08_loops')||0;if(loops>0)$('#tag').textContent=loops===1?'もう一度、別の可能性を見る。':`可能性の記録：${loops+1}周目`;
</script>
