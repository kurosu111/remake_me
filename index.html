<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RE:ME v0.4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05070b;color:#edf4fb;font-family:system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}.screen{display:none;min-height:100vh;padding:22px}.on{display:flex}.center{align-items:center;justify-content:center}.box{width:min(760px,100%);border:1px solid #2a384b;background:#0b1018;padding:28px}.micro{font-size:10px;letter-spacing:.2em;color:#8190a4}h1{font-size:clamp(72px,16vw,150px);letter-spacing:-.08em;margin:15px 0}h1 span{font-weight:300}.muted{color:#9ca9b9;line-height:1.7}.btn,.choice{border:1px solid #4b6078;background:#080c12;color:#eef5fc;padding:13px 16px;cursor:pointer}.btn:hover,.choice:hover{background:#eaf2fa;color:#06080b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin:14px 0}input,textarea{width:100%;padding:11px;margin-top:6px;background:#070a0f;color:white;border:1px solid #2b394c}#game{flex-direction:column}.bar{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #293649;padding:5px 2vw 15px}.tools{display:flex;gap:7px}.tiny{background:transparent;color:#aebccc;border:1px solid #35465d;padding:9px;cursor:pointer}.layout{width:min(1080px,100%);margin:auto;padding:24px 0;display:grid;grid-template-columns:220px 1fr;gap:16px}.side,.main{border:1px solid #293649;background:#0b1018;padding:17px}.avatar{height:180px;border:1px solid #27374b;background:radial-gradient(circle,#202d3e,#080c12 70%);display:grid;place-items:center;position:relative}.head{width:82px;height:115px;border:1px solid #8298b2;border-radius:45%}.name{position:absolute;bottom:8px;left:8px;font-size:9px;letter-spacing:.18em;color:#9badc2}.stats div{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #1d2938;color:#8f9caf}.main{min-height:500px;display:flex;flex-direction:column}.story{white-space:pre-line;font-family:serif;line-height:2;font-size:17px;min-height:230px}.choices{display:grid;gap:9px;margin-top:auto}.choice{text-align:left}.node{border-left:2px solid #60758f;background:#091019;padding:9px 12px;margin:9px 0}.old{opacity:.35}.hidden{display:none!important}.glitch{animation:g .15s steps(2) 8}@keyframes g{25%{transform:translateX(-5px)}50%{transform:translateX(4px);filter:contrast(2)}75%{transform:translateX(-2px)}}@media(max-width:700px){.grid,.layout{grid-template-columns:1fr}.avatar{height:130px}}
</style></head><body>
<section id="title" class="screen on center"><div style="text-align:center"><div class="micro">LIFE REMAKE SIMULATION / v0.4</div><h1>RE:<span id="word">ME</span></h1><p id="tag" class="muted">あの日、選ばなかった方へ。</p><button id="new" class="btn">NEW LIFE</button><button id="continue" class="btn hidden">CONTINUE MEMORY</button></div></section>
<section id="setup" class="screen center"><div class="box"><div class="micro">MEMORY PROFILE</div><h2>記録の起点</h2><p class="muted">固有名詞は任意。入力した言葉も記憶として使われます。</p><div class="grid"><label>生年<input id="birth" type="number" value="1990"></label><label>現在の年齢<input id="now" type="number" value="36"></label><label>高校名<input id="school" placeholder="○○高校"></label><label>地元・駅<input id="town" placeholder="○○駅"></label><label>よく行った場所<input id="place" placeholder="駅前のゲームセンター"></label><label>最初の勤務先<input id="company" placeholder="○○株式会社"></label></div><label>あの頃の自分に言いたいこと<textarea id="msg" placeholder="もっと好きなことをやってみろ"></textarea></label><button id="start" class="btn">REMAKE START</button></div></section>
<section id="game" class="screen"><header class="bar"><div><div id="phase" class="micro">REMAKE LIFE</div><strong id="age"></strong></div><div class="tools"><button id="save" class="tiny">MEMORY SAVE</button><button id="map" class="tiny">LIFE MAP</button></div></header><div class="layout"><aside class="side"><div class="avatar"><div class="head"></div><span id="name" class="name">REMAKE YOU</span></div><div id="stats" class="stats"></div></aside><main class="main"><div id="sceneTag" class="micro"></div><h2 id="sceneTitle"></h2><div id="story" class="story"></div><div id="choices" class="choices"></div></main></div></section>
<section id="lifeMap" class="screen center"><div class="box"><div class="micro">LIFE MAP</div><h2>選んだ人生</h2><p class="muted">◆は、後になって重要だったと分かる出来事。</p><div id="nodes"></div><button id="back" class="btn">BACK</button></div></section>
<section id="end" class="screen center"><div style="text-align:center;font-family:serif;line-height:2;font-size:21px"><p id="endText"></p><h1 id="endLogo" class="hidden">RE:<span>ME</span></h1><p id="endSub"></p><button id="your" class="btn hidden">CONTINUE YOUR LIFE</button></div></section>
<script>
const $=q=>document.querySelector(q),screens=[...document.querySelectorAll('.screen')],show=id=>{screens.forEach(x=>x.classList.remove('on'));$(id).classList.add('on')};
const SAVE='reme04-save',LOOPS='reme04-loops',OLD='reme04-old';let s=null,shownAt=0;
function fresh(){return{birth:+$('#birth').value||1990,now:+$('#now').value||36,school:$('#school').value.trim()||'高校',town:$('#town').value.trim()||'地元',place:$('#place').value.trim()||'いつもの店',company:$('#company').value.trim()||'最初の会社',msg:$('#msg').value.trim()||'もっと自分で選べ',i:0,fast:0,mapViews:0,loops:+localStorage.getItem(LOOPS)||0,path:[],stats:{study:40,social:40,courage:40,happy:50,money:25}}}
function scenes(){return[
{a:14,t:'放課後',x:`${s.school}の放課後。\n明日は小テスト。\n友達が「${s.place}、寄ってかない？」と聞いた。`,c:[['寄っていく',{social:4,happy:3}],['帰って勉強する',{study:5}],['少しだけ行く',{social:2,study:2}]]},
{a:15,t:'雨の日',x:`${s.town}の近くで突然雨が強くなった。\n普段あまり話さない同級生が傘を忘れている。`,c:[['傘に入れる',{social:5,courage:3}],['気づかないふりをする',{}]],turn:1},
{a:17,t:'進路希望',x:'先生は何気なく紙を机に置いた。\n「来週まででいいからな」\n\nそれが数年後まで続く道の入口だとは、この時は分からない。',c:[['安定を優先する',{money:2}],['興味を優先する',{courage:5,happy:2}],['まだ決めない',{}]],turn:1},
{a:18,t:'卒業前',x:`卒業式まであと少し。\n記録の片隅に、最初に入力された言葉がある。\n\n「${s.msg}」`,c:[['その言葉を覚えておく',{courage:2}],['今は分からない',{}]]},
{a:20,t:'一本の電話',x:'夕方、知らない番号から電話が来た。\n出なくても、今日という日は普通に終わる。',c:[['出る',{courage:3,social:2}],['出ない',{}]],turn:1},
{a:22,t:'仕事',x:`${s.company}という名前を知っている。\nでも、この人生では同じ場所へ行く必要はない。`,c:[['会社員として働く',{money:5}],['技術職を目指す',{study:4,money:3}],['全く違う道へ行く',{courage:6,happy:3,money:-2}]]},
{a:24,t:'何でもない休日',x:'予定のない休日。\nゲームなら、飛ばしてしまってもいいような一日だ。',c:[['誰かに連絡する',{social:3,happy:3}],['一人で過ごす',{happy:2}],['何もしない',{happy:1}]]},
{a:26,t:'少し先へ',x:s.fast>=4?'人生はかなりの速度で進んでいる。\n画面の中では何年も経った。あなたにとっては、ほんの数分だ。':'大きな出来事がない時間も、人生には含まれている。',c:[['次へ進む',{}],['少し考える',{happy:1}]]},
{a:28,t:'……',x:s.loops?'「……また来た。」\n\n「前にも、ここまでやったよね。」\n\n「今回は何を変えるの？」':'「ねえ。」\n\n「ずっといるよね。そこに。」\n\n「俺の人生を選んでる人。」',c:[['……続ける',{}],['何のこと？',{courage:1}]],aware:1},
{a:30,t:'見てた',x:s.fast>=4?'「急いでたよね。」\n\n「何年分も、ほとんど止まらなかった。」\n\n「人生をやり直したかったんじゃないの？」\n\n「なんで、また急いでるの？」':`「選ぶたびに考えてたね。」\n\n「LIFE MAPも ${s.mapViews} 回見た。」\n\n「俺の人生なのに、お前の方が迷ってた。」`,c:[['ごめん',{}],['ゲームだから',{}],['……',{}]],aware:1},
{a:s.now,t:'ここから先',x:`「俺はいま、${s.now}歳。」\n\n「ここから先は、お前も知らない。」\n\n「だったら、もう俺を作り直す必要ないよ。」\n\n「次に選ぶのは――」`,final:1}]}
function drawStats(){$('#stats').innerHTML=Object.entries({study:'学力',social:'社交性',courage:'勇気',happy:'幸福度',money:'経済力'}).map(([k,v])=>`<div><span>${v}</span><b>${s.stats[k]}</b></div>`).join('')}
function render(){const e=scenes()[s.i];$('#age').textContent=`AGE ${e.a} / ${s.birth+e.a}`;$('#sceneTitle').textContent=e.t;$('#sceneTag').textContent=e.turn?'MEMORY / UNMARKED EVENT':'MEMORY '+String(s.i+1).padStart(2,'0');$('#story').textContent=e.x;$('#choices').innerHTML='';if(e.aware){$('#phase').textContent='SYNC ERROR';$('#name').textContent='REMAKE Y0U';document.body.classList.add('glitch');setTimeout(()=>document.body.classList.remove('glitch'),1200)}if(e.final){setTimeout(ending,1900);return}shownAt=Date.now();e.c.forEach(([label,delta])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>choose(e,label,delta);$('#choices').appendChild(b)})}
function choose(e,label,d){if((Date.now()-shownAt)<1800)s.fast++;Object.entries(d).forEach(([k,v])=>s.stats[k]=Math.max(0,Math.min(99,s.stats[k]+v)));s.path.push({age:e.a,title:e.t,choice:label,turn:!!e.turn});s.i++;drawStats();render()}
function ending(){localStorage.setItem(OLD,JSON.stringify(s.path));localStorage.setItem(LOOPS,String(s.loops+1));localStorage.removeItem(SAVE);show('#end');$('#endText').textContent='「続きは、そっちでやってよ。」';setTimeout(()=>{$('#endLogo').classList.remove('hidden');setTimeout(()=>{$('#endLogo').classList.add('glitch');$('#endLogo').innerHTML='RE:<span>YOU</span>';$('#endSub').textContent='ここから先は、まだ記録されていない。';setTimeout(()=>$('#your').classList.remove('hidden'),800)},1100)},800)}
$('#new').onclick=()=>show('#setup');$('#start').onclick=()=>{s=fresh();show('#game');drawStats();render()};$('#save').onclick=()=>{localStorage.setItem(SAVE,JSON.stringify(s));alert('MEMORY SAVED')};$('#map').onclick=()=>{s.mapViews++;let old=[];try{old=JSON.parse(localStorage.getItem(OLD)||'[]')}catch{}$('#nodes').innerHTML=old.map(x=>`<div class="node old">${x.age}歳 / ${x.title} — ${x.choice}</div>`).join('')+s.path.map(x=>`<div class="node">${x.turn?'◆ ':''}${x.age}歳 / ${x.title} — ${x.choice}</div>`).join('');show('#lifeMap')};$('#back').onclick=()=>show('#game');$('#your').onclick=()=>{show('#title');$('#word').textContent='YOU';$('#tag').textContent='ここから先は、あなたの番。'};
const saved=localStorage.getItem(SAVE);if(saved){$('#continue').classList.remove('hidden');$('#continue').onclick=()=>{s=JSON.parse(saved);show('#game');drawStats();render()}}if(+localStorage.getItem(LOOPS)>0)$('#tag').textContent='……また来たんだ。';
</script></body></html>
